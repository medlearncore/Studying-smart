    function AnnouncementTicker({ announcements, lang, onNavigate }) {
      const activeItems = announcements.filter(a => a.active);
      const [currentIndex, setCurrentIndex] = useState(0);

      useEffect(() => {
        if (activeItems.length <= 1) return;
        const timer = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % activeItems.length);
        }, 7000);
        return () => clearInterval(timer);
      }, [activeItems.length]);

      if (!activeItems.length) return null;
      const current = activeItems[currentIndex];

      return (
        <div className="bg-brand-blue/10 border-b border-brand-blue/20 text-brand-deep px-4 py-2.5 text-xs font-semibold transition-all">
          <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div className="flex items-center gap-2.5 overflow-hidden">
              <span className={`px-2 py-0.5 rounded text-[10px] font-black tracking-wider uppercase text-white shadow-sm ${
                current.type === 'automatic' ? 'bg-brand-aqua' : 'bg-brand-blue'
              }`}>
                {current.type === 'automatic' ? 'Live Content' : 'Announcement'}
              </span>
              <span className="font-bold truncate text-slate-900">{current.title}</span>
              <span className="hidden md:inline text-slate-600 truncate font-normal">— {current.message}</span>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button
                onClick={() => onNavigate(current.targetPath || 'qbank')}
                className="text-brand-blue font-bold hover:underline flex items-center gap-1 text-xs"
              >
                <span>{lang === 'ar' ? 'عرض المحتوى' : 'Explore Now'}</span>

              </button>

          </div>
        </div>

    // 8. بنك الأسئلة السريرية ومحاكي امتحانات USMLE / NBME (PART 4)
    // =========================================================================
    function QuestionBankView({ t, stage, questions, onAnswerSubmitted }) {
      const [filterSystem, setFilterSystem] = useState("All");
      const [filterDifficulty, setFilterDifficulty] = useState("All");
      const [activeQIndex, setActiveQIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [mode, setMode] = useState("tutor"); // 'tutor' (شرح فوري) | 'exam' (وضع الامتحان الصارم)
      const [bookmarked, setBookmarked] = useState(false);
      const [timerSec, setTimerSec] = useState(0);

      // تصفية الأسئلة السريرية ديناميكياً
      const filteredQuestions = useMemo(() => {
        return questions.filter((q) => {
          const matchStage = q.stage === stage;
          const matchSystem = filterSystem === "All" || q.system === filterSystem;
          const matchDiff = filterDifficulty === "All" || q.difficulty === filterDifficulty;
          return matchStage && matchSystem && matchDiff;
        });
      }, [questions, stage, filterSystem, filterDifficulty]);

      const currentQ = filteredQuestions[activeQIndex] || filteredQuestions[0];

      // إعادة تعيين الحالة عند تغيير السؤال أو التصفيات
      useEffect(() => {
        setSelectedOption(null);
        setIsSubmitted(false);
        setBookmarked(false);
      }, [activeQIndex, filterSystem, filterDifficulty]);

      // مؤقت الامتحان السريري الحي
      useEffect(() => {
        const interval = setInterval(() => setTimerSec(prev => prev + 1), 1000);
        return () => clearInterval(interval);
      }, []);

      const formatTime = (totalSeconds) => {
        const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const s = (totalSeconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const handleSubmitAnswer = () => {
        if (!selectedOption) return;
        setIsSubmitted(true);
        if (onAnswerSubmitted && currentQ) {
          onAnswerSubmitted(currentQ.id, selectedOption === currentQ.correct);
        }
      };

      if (!currentQ) {
        return (
          <div className="bg-white rounded-2xl border border-brand-border p-12 text-center space-y-4 shadow-sm">
            <i data-lucide="filter-x" className="w-12 h-12 text-slate-300 mx-auto"></i>
            <h3 className="text-base font-bold text-slate-700">No vignettes match the active filter criteria</h3>
            <p className="text-xs text-slate-500 font-medium">Try clearing your filters or choosing another organ system above.</p>
            <button
              onClick={() => { setFilterSystem("All"); setFilterDifficulty("All"); }}
              className="px-5 py-2.5 bg-brand-blue text-white rounded-xl text-xs font-bold shadow-md"
            >
              {t.qbank.resetFilters}
            </button>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          
          {/* شريط أدوات محاكاة الامتحان الرسمي (USMLE Exam Simulation Toolbar) */}
          <div className="bg-white rounded-2xl border border-brand-border p-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs font-black text-brand-blue bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200">
                  {currentQ.id}
                </span>
                <span className="text-xs font-bold text-slate-800">{currentQ.subject} • {currentQ.system}</span>
                <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-bold ${
                  currentQ.difficulty === 'Hard' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                }`}>
                  {currentQ.difficulty}
                </span>
              </div>
              <h2 className="text-sm font-black text-slate-900 mt-1">{currentQ.topic}</h2>
            </div>

            {/* أدوات التحكم بالاختبار: المؤقت، النمط، والحفظ */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 font-mono text-xs bg-slate-100 px-3.5 py-1.5 rounded-xl border border-slate-200 font-bold text-slate-700 shadow-inner">
                <i data-lucide="clock" className="w-4 h-4 text-slate-500"></i>
                <span>{formatTime(timerSec)}</span>
              </div>
              
              <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
                <button
                  onClick={() => setMode('tutor')}
                  className={`px-3 py-1 rounded-lg font-bold transition ${mode === 'tutor' ? 'bg-white text-brand-blue shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}
                >
                  {t.qbank.modeTutor}
                </button>
                <button
                  onClick={() => setMode('exam')}
                  className={`px-3 py-1 rounded-lg font-bold transition ${mode === 'exam' ? 'bg-white text-brand-blue shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}
                >
                  {t.qbank.modeExam}
                </button>
              </div>

              <button
                onClick={() => setBookmarked(!bookmarked)}
                className={`p-2.5 rounded-xl border transition ${bookmarked ? 'bg-amber-50 text-amber-600 border-amber-300 shadow-sm' : 'bg-white text-slate-400 border-slate-200 hover:text-slate-600'}`}
                title={t.qbank.bookmark}
              >
                <i data-lucide="bookmark" className="w-4 h-4"></i>
              </button>
            </div>
          </div>

          {/* مساحة عرض الحالة السريرية (Clinical Vignette Display Canvas) */}
          <div className="bg-white rounded-2xl border border-brand-border p-6 sm:p-8 shadow-sm space-y-6">
            
            {/* نص الحالة السريرية المعقدة */}
            <div className="text-sm leading-relaxed text-slate-800 bg-slate-50/80 p-5 rounded-2xl border border-slate-200/80 font-normal select-text">
              {currentQ.vignette}
            </div>

            {/* منطوق السؤال التشخيصي */}
            <div className="text-sm font-black text-brand-darkText">
              {currentQ.stem}
            </div>

            {/* الخيارات السريرية المتغيرة (Variable Answer Choices) */}
            <div className="space-y-3">
              {currentQ.options.map((opt) => {
                const isSelected = selectedOption === opt.key;
                const showCorrect = isSubmitted && opt.key === currentQ.correct;
                const showWrong = isSubmitted && isSelected && opt.key !== currentQ.correct;

                let optionStyles = "border-slate-200 bg-white hover:bg-slate-50 text-slate-800";
                if (isSelected && !isSubmitted) {
                  optionStyles = "border-brand-blue bg-blue-50/60 text-brand-blue font-bold ring-2 ring-brand-blue/30";
                } else if (showCorrect) {
                  optionStyles = "border-emerald-500 bg-emerald-50 text-emerald-950 font-bold ring-2 ring-emerald-500/40";
                } else if (showWrong) {
                  optionStyles = "border-rose-500 bg-rose-50 text-rose-950 font-bold ring-2 ring-rose-500/40";
                }

                return (
                  <div
                    key={opt.key}
                    onClick={() => { if (!isSubmitted) setSelectedOption(opt.key); }}
                    className={`p-4 rounded-xl border transition cursor-pointer flex items-start gap-3.5 ${optionStyles}`}
                  >
                    <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-black shrink-0 mt-0.5 ${
                      showCorrect ? 'bg-emerald-600 text-white' :
                      showWrong ? 'bg-rose-600 text-white' :
                      isSelected ? 'bg-brand-blue text-white' : 'bg-slate-100 text-slate-700'
                    }`}>
                      {opt.key}
                    </span>
                    
                    <div className="flex-1 text-xs leading-relaxed">
                      <span className="font-medium text-slate-900">{opt.text}</span>
                      
                      {/* الشرح التفصيلي للبديل في وضع المعلم بعد الإجابة */}
                      {isSubmitted && mode === 'tutor' && (
                        <div className={`mt-2.5 p-3 rounded-lg text-[11px] leading-relaxed ${
                          opt.key === currentQ.correct ? 'bg-emerald-100/70 text-emerald-950 font-medium' : 'bg-slate-100 text-slate-600'
                        }`}>
                          <strong>Option {opt.key}:</strong> {opt.explanation}
                        </div>

    // 13. المساعد الطبي السقراطي الذكي (PART 11 - AI STUDY ASSISTANT)
    // =========================================================================
    function AIAssistantView({ t }) {
      const [prompt, setPrompt] = useState("");
      const [chat, setChat] = useState([
        {
          role: "assistant",
          text: "Greetings, Doctor. I am your USMLE Medical Knowledge Assistant. Ask me to break down complex physiological loops, differential diagnoses, or create a targeted micro-vignette."
        }
      ]);

      const handleSend = () => {
        if (!prompt.trim()) return;
        const userMsg = prompt;
        setChat(prev => [...prev, { role: "user", text: userMsg }]);
        setPrompt("");

        setTimeout(() => {
          setChat(prev => [
            ...prev,
            {
              role: "assistant",
              text: `Diagnostic Synthesis for: "${userMsg}"\n\nHigh-Yield Board Association:\n1. Consider the underlying pathophysiological mechanism first.\n2. In examinations, differentiate acute valvular disruptions (normal chamber sizes with acute pulmonary edema) from chronic compensated valvular lesions (massive eccentric or concentric hypertrophy).\nAlways corroborate with verified peer-reviewed literature (Robbins Pathology & Harrison's Internal Medicine)!`
            }
          ]);
        }, 600);
      };

      return (
        <div className="bg-white rounded-2xl border border-brand-border p-6 sm:p-8 shadow-sm space-y-4">
          <div>
            <span className="text-xs font-bold text-brand-blue uppercase tracking-wider">Clinical Reasoning Engine</span>

          <div className="h-80 overflow-y-auto space-y-3.5 p-4 bg-slate-50/80 rounded-2xl border border-slate-200">
            {chat.map((msg, i) => (
              <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] p-4 rounded-2xl text-xs leading-relaxed whitespace-pre-line ${
                  msg.role === 'user' ? 'bg-brand-blue text-white shadow-md' : 'bg-white text-slate-800 border border-slate-200 shadow-sm'
                }`}>
                  {msg.text}
                </div>
              </div>
            ))}
          </div>

          <div className="flex gap-2.5">
            <input
              type="text"
              value={prompt}
              onChange={(e) => setPrompt(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') handleSend(); }}
              placeholder="e.g., Explain the difference between nephritic and nephrotic urinary casts..."

              onClick={handleSend}
              className="px-5 py-2.5 bg-brand-blue hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition"
            >
              Query
            </button>
          </div>
        </div>
      );
    }

    }

    // =========================================================================
    // 16.4 مشرف الأسئلة ومعالج الاستيراد 7-STEPS (PART 5 & PART 7.4)
    // =========================================================================
    function SuperAdminQuestionsView({ t, questions, setQuestions, setAnnouncements }) {
      const [activeStep, setActiveStep] = useState(1);
      const [fileName, setFileName] = useState("");
      const [detectedRows, setDetectedRows] = useState(0);

      // المطابقة المرنة للأعمدة (Flexible Column Mapping)
      const [mappings, setMappings] = useState({
        vignette: "Question_Stem",
        optionA: "Choice_A",
        optionB: "Choice_B",
        optionC: "Choice_C",
        optionD: "Choice_D",
        correct: "Answer_Key",
        rationale: "Clinical_Rationale"
      });

      const sampleImportData = [
        {
          id: "IMP-9001",
          stage: "step1",
          subject: "Pathology",
          system: "Respiratory System",
          topic: "Idiopathic Pulmonary Fibrosis Pathogenesis",
          difficulty: "Hard",
          vignette: "A 66-year-old male presents with worsening exertional dyspnea and persistent dry cough for 8 months. High-resolution CT of the chest demonstrates bilateral subpleural reticular opacities and honeycombing primarily in the lower lobes.",
          stem: "Which of the following cytokine mediators is most critically implicated in the pathogenesis of this condition?",
          options: [
            { key: "A", text: "Transforming growth factor-beta (TGF-beta)", explanation: "Correct. TGF-beta drives fibroblast proliferation, differentiation into myofibroblasts, and excessive extracellular matrix collagen deposition." },
            { key: "B", text: "Interleukin-4", explanation: "Primarily involved in Th2 responses and IgE class switching." },
            { key: "C", text: "Interferon-gamma", explanation: "Macrophage activator synthesized by Th1 cells, not the central fibrogenic driver in IPF." }
          ],
          correct: "A",
          rationale: "Idiopathic pulmonary fibrosis is characterized by repetitive epithelial injury and aberrant wound healing driven predominantly by TGF-beta.",
          objective: "Recognize the pivotal role of TGF-beta in pulmonary fibroblastic foci formation.",
          reference: "Robbins Basic Pathology, 10th Ed."
        }
      ];

      const handleSimulateFileUpload = () => {
        setFileName("USMLE_Step1_HighYield_Batch_2026.xlsx");
        setDetectedRows(24);
        setActiveStep(2);
      };

      const handleConfirmImport = () => {
        const itemToImport = {
          ...sampleImportData[0],
          version: 1,
          published: true
        };

        setQuestions(prev => [itemToImport, ...prev]);

        // إعلان تلقائي فوري
        const autoAnn = {
          id: `ANN-AUTO-Q-${Date.now()}`,
          title: `New Question Set Available — ${itemToImport.system} (Step 1)`,
          message: `Fresh clinical vignettes in ${itemToImport.topic} have been directly published to the Question Bank.`,
          type: "automatic",
          publishedAt: new Date().toISOString().split('T')[0],
          active: true,
          stage: "step1",
          targetPath: "qbank"
        };
        setAnnouncements(prev => [autoAnn, ...prev]);

        setActiveStep(7);
      };

      return (
        <div className="space-y-6">
          <div className="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 text-emerald-900 text-xs flex flex-col sm:flex-row justify-between sm:items-center gap-3">
            <div className="flex items-center gap-2.5">
              <i data-lucide="help-circle" className="w-5 h-5 text-emerald-700 shrink-0"></i>
              <span><strong>Super Admin (Questions) Domain:</strong> Direct publish to Question Bank authorized without Owner approval. Strictly barred from Lectures and Member Accounts.</span>
            </div>
            <span className="font-mono font-bold bg-emerald-200/70 px-2.5 py-1 rounded-lg text-[10px]">Direct Publish Active</span>
          </div>

          {/* معالج الاستيراد الذكي ذو الخطوات السبع (7-STEP WIZARD) */}
          <div className="bg-white rounded-2xl border border-brand-border p-6 sm:p-8 space-y-6 shadow-sm">
            <div>
              <h3 className="text-base font-black text-slate-900">{t.importer.title}</h3>
              <p className="text-xs text-slate-500 mt-0.5">{t.importer.desc}</p>
            </div>

            {/* شريط خطوات المعالج السبع */}
            <div className="flex items-center justify-between overflow-x-auto pb-2 border-b border-slate-100 text-xs gap-2">
              {[
                { s: 1, label: t.importer.step1 },
                { s: 2, label: t.importer.step2 },
                { s: 3, label: t.importer.step3 },
                { s: 4, label: t.importer.step4 },
                { s: 5, label: t.importer.step5 },
                { s: 6, label: t.importer.step6 },
                { s: 7, label: t.importer.step7 }
              ].map(st => (
                <div
                  key={st.s}
                  onClick={() => { if (fileName && st.s <= 6) setActiveStep(st.s); }}
                  className={`px-3.5 py-1.5 rounded-xl font-bold whitespace-nowrap cursor-pointer transition ${
                    activeStep === st.s ? 'bg-brand-blue text-white shadow-md shadow-blue-500/20' :
                    st.s < activeStep ? 'text-emerald-700 bg-emerald-50 border border-emerald-200' : 'text-slate-400'
                  }`}
                >
                  {st.label}
                </div>
              ))}
            </div>

            {/* الخطوة 1: رفع الملف */}
            {activeStep === 1 && (
              <div className="border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center space-y-4 hover:border-brand-blue transition">
                <i data-lucide="file-up" className="w-12 h-12 text-brand-blue mx-auto"></i>
                <div>
                  <h4 className="text-sm font-bold text-slate-900">{t.importer.uploadPrompt}</h4>
                  <p className="text-xs text-slate-400 mt-1">Accepts flexible Excel formats without enforcing rigid single templates.</p>
                </div>
                <button
                  onClick={handleSimulateFileUpload}
                  className="px-6 py-2.5 bg-brand-blue hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition"
                >
                  Select Sample Clinical Spreadsheet (.xlsx)
                </button>
              </div>
            )}

            {/* الخطوة 2: فحص البنية */}
            {activeStep === 2 && (
              <div className="space-y-4">
                <div className="p-5 bg-slate-50 rounded-xl border text-xs space-y-2">
                  <div><strong>Loaded File:</strong> {fileName}</div>
                  <div><strong>Worksheet:</strong> "Sheet1_Clinical_Vignettes"</div>
                  <div><strong>Discovered Rows:</strong> {detectedRows} records</div>
                  <div><strong>Discovered Headers:</strong> Question_Stem, Choice_A, Choice_B, Choice_C, Choice_D, Answer_Key, Clinical_Rationale</div>
                </div>
                <button onClick={() => setActiveStep(3)} className="px-5 py-2.5 bg-brand-blue text-white rounded-xl text-xs font-bold shadow">
                  Proceed to Column Mapping
                </button>
              </div>
            )}

            {/* الخطوة 3: تعيين الحقول المرن */}
            {activeStep === 3 && (
              <div className="space-y-4">
                <h4 className="text-xs font-black text-slate-700 uppercase">Map Source Headers to Platform Schema</h4>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  {Object.keys(mappings).map(f => (
                    <div key={f} className="p-3.5 bg-slate-50 rounded-xl border flex justify-between items-center">
                      <span className="font-bold text-slate-700">{f}</span>
                      <select
                        value={mappings[f]}
                        onChange={(e) => setMappings({ ...mappings, [f]: e.target.value })}
                        className="px-2.5 py-1.5 border rounded-lg bg-white text-xs font-bold"
                      >
                        <option value={mappings[f]}>{mappings[f]}</option>
                        <option value="Custom_Field">Custom_Field</option>
                      </select>
                    </div>
                  ))}
                </div>
                <button onClick={() => setActiveStep(4)} className="px-5 py-2.5 bg-brand-blue text-white rounded-xl text-xs font-bold shadow">
                  Save Mappings & Preview
                </button>
              </div>
            )}

            {/* الخطوة 4: معاينة السؤال المطابق للواجهة الحقيقية */}
            {activeStep === 4 && (
              <div className="space-y-4">
                <h4 className="text-xs font-black text-slate-700 uppercase">Student Experience Preview</h4>
                <div className="p-5 rounded-2xl border border-blue-200 bg-blue-50/40 text-xs space-y-3">
                  <span className="font-mono text-brand-blue font-bold">{sampleImportData[0].id}</span>
                  <div className="text-slate-800">{sampleImportData[0].vignette}</div>
                  <div className="font-bold text-slate-900">{sampleImportData[0].stem}</div>
                  <div className="space-y-1.5">
                    {sampleImportData[0].options.map(o => (
                      <div key={o.key} className="p-2.5 rounded-lg bg-white border text-slate-700">
                        <strong>{o.key}:</strong> {o.text}
                      </div>
                    ))}
                  </div>
                </div>
                <button onClick={() => setActiveStep(5)} className="px-5 py-2.5 bg-brand-blue text-white rounded-xl text-xs font-bold shadow">
                  Run Diagnostic Validation Matrix
                </button>
              </div>
            )}

            {/* الخطوة 5: مصفوفة التدقيق والتحقق من التكرار */}
            {activeStep === 5 && (
              <div className="space-y-4 text-xs">
                <div className="p-5 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-950 space-y-2">
                  <div className="font-bold text-sm">✓ Structural Integrity & Duplicate Audit Passed</div>
                  <div>• Valid Answer Keys (No missing correct keys)</div>
                  <div>• Duplicate Detection: 0 exact matches detected against live bank</div>
                  <div>• Classification: Successfully mapped to Respiratory Pathology</div>
                </div>
                <button onClick={() => setActiveStep(6)} className="px-5 py-2.5 bg-brand-blue text-white rounded-xl text-xs font-bold shadow">
                  Proceed to Direct Import Execution
                </button>
              </div>
            )}

            {/* الخطوة 6: تنفيذ الاستيراد والنشر المباشر */}
            {activeStep === 6 && (
              <div className="p-8 bg-slate-50 rounded-2xl border text-center space-y-4">
                <h4 className="text-sm font-bold text-slate-900">Direct Publishing Authorization</h4>
                <p className="text-xs text-slate-600 max-w-md mx-auto leading-relaxed">
                  As Super Admin for Questions, you are authorized to publish these items directly into the live Question Bank without Owner approval.
                </p>
                <button
                  onClick={handleConfirmImport}
                  className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-600/20"
                >
                  {t.importer.executeImport}
                </button>
              </div>
            )}

            {/* الخطوة 7: تقرير الإنجاز النهائي */}
            {activeStep === 7 && (
              <div className="p-6 bg-emerald-50 border border-emerald-200 rounded-2xl space-y-4 text-xs">
                <div className="flex items-center gap-2 text-emerald-900 font-bold text-sm">
                  <i data-lucide="check-circle" className="w-5 h-5 text-emerald-600"></i>
                  <span>Import Completed & Live in Student Bank</span>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                  <div className="bg-white p-3 rounded-xl border">
                    <span className="text-slate-500">Total Rows</span>
                    <div className="text-base font-bold text-slate-800">{detectedRows}</div>
                  </div>
                  <div className="bg-white p-3 rounded-xl border">
                    <span className="text-slate-500">Successfully Ingested</span>
                    <div className="text-base font-bold text-emerald-600">{detectedRows}</div>
                  </div>
                  <div className="bg-white p-3 rounded-xl border">
                    <span className="text-slate-500">Flagged Anomalies</span>
                    <div className="text-base font-bold text-slate-400">0</div>
                  </div>
                  <div className="bg-white p-3 rounded-xl border">
                    <span className="text-slate-500">Announcement</span>
                    <div className="text-base font-bold text-brand-blue">Auto-Broadcasted</div>
                  </div>
                </div>
                <p className="text-emerald-950 font-medium">{t.importer.successAlert}</p>
                <button
                  onClick={() => setActiveStep(1)}
                  className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold"
                >
                  Process Another Question Batch
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    // =========================================================================
    // 17. تشغيل وتثبيت تطبيق REACT في المتصفح (APPLICATION MOUNTING)
    // =========================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
